name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # Throwaway values for the ephemeral Postgres service
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: cps420
      POSTGRES_PASSWORD: cps420-ci-password
      POSTGRES_DB: cps420
      JWT_SECRET: ci-only-signing-key-not-used-outside-ci

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cps420
          POSTGRES_USER: cps420
          POSTGRES_PASSWORD: cps420-ci-password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U cps420 -d cps420"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run backend tests
        run: uv run pytest --cov=main --cov-report=term-missing

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Pylint
        run: uv run pylint .

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # Import-time configuration only. The engine is created lazily, so these
    # placeholders let the app construct without a running Postgres service.
    env:
      POSTGRES_USER: build
      POSTGRES_PASSWORD: build
      POSTGRES_DB: build
      JWT_SECRET: build-only-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify the application imports
        run: uv run python -c "import main; print(main.app.title)"

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:coverage

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit catches type errors that Vitest's esbuild transform
      # strips without checking.
      - name: Type-check and bundle
        run: npm run build
