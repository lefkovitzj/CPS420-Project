[project]
name = "cps420-server"
version = "0.1.0"
description = "FastAPI backend for the CPS 420 project"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.0",
    "fastapi>=0.115.0",
    "playwright>=1.65.2",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pylint>=4.1.4",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.uv]
package = false

[tool.pylint.main]
py-version = "3.13"
jobs = 0
ignore = [".venv", "__pycache__", ".pytest_cache"]
fail-under = 7.0

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
good-names = ["SessionLocal"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["main"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
