server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS keeps the proxy working when the backend container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        # BACKEND_PORT is substituted by the nginx image at container startup.
        set $backend backend:${BACKEND_PORT};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }

    # Serve static files when they exist, otherwise let the React app handle
    # the route (for example /login or /register) instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
