server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # BACKEND_PORT is substituted by the nginx image at container startup.
        # The trailing slash strips /api/ before forwarding to the backend.
        proxy_pass http://backend:${BACKEND_PORT}/;
    }

    # Serve static files when they exist, otherwise let the React app handle
    # the route (for example /login or /register) instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}