services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "${HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0"]
    restart: unless-stopped
    ports:
      - "${HOST:-127.0.0.1}:${SEAWEEDFS_S3_PORT:-8333}:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
    volumes:
      - ./data/seaweedfs:/data

  backend:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "${HOST:-127.0.0.1}:${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}"
    environment:
      HOST: ${HOST:-127.0.0.1}
      PORT: ${BACKEND_PORT:-5000}
